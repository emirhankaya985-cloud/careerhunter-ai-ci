name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - name: Parse guarded Windows backup/migration PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/migrate_render_to_neon_windows.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: local backup and migration helper syntax"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerhunter_ci
          POSTGRES_USER: careerhunter_ci
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerhunter_ci -d careerhunter_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -e '.[dev]'
      - name: Run PostgreSQL integration tests on disposable CI database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://careerhunter_ci:ci_disposable_only@localhost:5432/careerhunter_ci
        run: pytest -q tests/test_database.py -k postgresql
