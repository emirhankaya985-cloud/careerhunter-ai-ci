name: Hourly Career Intelligence

# GitHub Actions owns the schedule and runs the collector directly.
# The website is an optional viewer; collection does not call Render.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CAREERHUNTER_PROFILE_JSON: ${{ secrets.CAREERHUNTER_PROFILE_JSON }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_DELIVERY_MODE: github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Require the production PostgreSQL secret
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL GitHub Actions secret is required; refusing local SQLite fallback." >&2
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*|postgresql+psycopg://*) ;;
            *) echo "DATABASE_URL must point to PostgreSQL." >&2; exit 1 ;;
          esac
          if [ -z "${CAREERHUNTER_PROFILE_JSON:-}" ]; then
            echo "CAREERHUNTER_PROFILE_JSON GitHub Actions secret is required; refusing sample-profile scoring." >&2
            exit 1
          fi
      - name: Install collector
        run: pip install -e .
      - name: Scan ATS boards and save results directly to production PostgreSQL
        run: python -m careerhunter run --slot jobs
