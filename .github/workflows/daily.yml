name: Daily Career Intelligence

# Scheduled job runner needs no Bot token and no PostgreSQL password.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/careerhunter-rescan-2026-10-26.txt
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect real job postings in Render PostgreSQL
        shell: bash
        run: python src/careerhunter/render_scan_client.py
