name: Daily Career Intelligence

# A 09:17 Turkey time scheduled run with a zero-secret identity token.
# Render owns the DB URL; the runner only requests a short-lived GitHub OIDC token.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/daily.yml
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect real job postings in Render PostgreSQL
        shell: bash
        run: python src/careerhunter/render_scan_client.py

      - name: Telegram daily top matches (secrets stay in GitHub)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/careerhunter/telegram_github.py --digest
      - name: Telegram alert if collection fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/careerhunter/telegram_github.py --failure
