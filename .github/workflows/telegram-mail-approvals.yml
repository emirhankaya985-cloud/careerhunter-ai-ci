name: CareerHunter Telegram HR Email Approvals

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-mail-approvals.yml
      - src/careerhunter/telegram_mail_approval.py
      - src/careerhunter/telegram_mail_worker.py
      - src/careerhunter/scheduled_scan.py
      - src/careerhunter/private_site.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-telegram-mail-approvals
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Deliver queued owner-reviewed drafts and configure the guarded callback webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m pip install 'httpx>=0.27,<1'
          PYTHONPATH=src python -m careerhunter.telegram_mail_worker
