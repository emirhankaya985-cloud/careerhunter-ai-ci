name: CareerHunter Gmail Readonly Live Acceptance

# One-time, source-owned verification of server OAuth, without sending mail.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gmail-acceptance.yml
      - src/careerhunter/gmail_acceptance.py
      - src/careerhunter/gmail_reader.py

permissions:
  contents: read

jobs:
  gmail_acceptance:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Verify read-only OAuth and read at most three messages in GitHub Actions
        env:
          CAREERHUNTER_GMAIL_READONLY_ENABLED: ${{ secrets.CAREERHUNTER_GMAIL_READONLY_ENABLED }}
          GMAIL_READONLY_CLIENT_ID: ${{ secrets.GMAIL_READONLY_CLIENT_ID }}
          GMAIL_READONLY_CLIENT_SECRET: ${{ secrets.GMAIL_READONLY_CLIENT_SECRET }}
          GMAIL_READONLY_REFRESH_TOKEN: ${{ secrets.GMAIL_READONLY_REFRESH_TOKEN }}
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from careerhunter.gmail_reader import configured, read_readonly
          if os.getenv("CAREERHUNTER_GMAIL_READONLY_ENABLED") != "true":
              raise SystemExit("FAIL: Gmail read-only feature has not been explicitly enabled")
          if not configured():
              raise SystemExit("FAIL: GitHub Gmail read-only OAuth secrets are incomplete")
          result = read_readonly(max_results=3).as_dict()
          if result.get("status") != "ready" or result.get("automatic_replies_sent") != 0:
              raise SystemExit("FAIL: bounded Gmail read-only acceptance failed")
          print("PASS: real Gmail readonly scan, bounded to 3 messages")
          print("Messages scanned:", int(result.get("scanned", 0)))
          print("No Gmail message sent, modified or exposed")
          PY
