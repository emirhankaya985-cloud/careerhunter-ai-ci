name: Live Render dashboard smoke check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/site-smoke.yml
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live dashboard, database, and anonymous protection
        env:
          BASE_URL: https://careerhunter-private-dashboard.onrender.com
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"]
          def get(path):
              request = urllib.request.Request(
                  base + path, headers={"User-Agent": "CareerHunter-CI-Smoke/1.0"})
              with urllib.request.urlopen(request, timeout=40) as response:
                  body = response.read(4096).decode("utf-8", errors="replace")
                  return response.status, response.geturl(), body, response.headers

          for retry in range(8):
              try:
                  status, final_url, body, headers = get("/readyz")
                  assert status == 200 and body.strip() == "ready", (
                      f"Database readiness invalid: status={status}, body={body[:80]!r}")
                  print("PASS: database schema and SQL SELECT checks")
                  break
              except (urllib.error.URLError, AssertionError, TimeoutError) as exc:
                  if retry == 7:
                      raise SystemExit(
                          f"FAIL: live PostgreSQL readiness never succeeded: {type(exc).__name__}: {exc}")
                  time.sleep(20)

          status, final_url, body, headers = get("/")
          assert status == 200 and final_url.endswith("/login"), (
              "FAIL: anonymous access was not redirected to the login page")
          assert "no-store" in headers.get("Cache-Control", ""), (
              "FAIL: private dashboard caching must be disabled")
          assert headers.get("X-Frame-Options") == "DENY", (
              "FAIL: frame guard missing")
          print("PASS: anonymous redirect, login page, and security headers")

          status, url, body, _ = get("/healthz")
          assert status == 200 and body.strip() == "ok", "FAIL: application health endpoint"
          print("PASS: live app process health")

          status, url, body, _ = get("/robots.txt")
          assert status == 200 and "Disallow: /" in body, (
              "FAIL: private panel must disallow crawlers")
          print("PASS: owner-only site excluded from crawlers")

          status, final_url, body, headers = get("/telegram/setup")
          assert status == 200 and final_url.endswith("/login"), (
              "FAIL: Telegram pairing page must require authentication")
          assert "no-store" in headers.get("Cache-Control", ""), (
              "FAIL: private Telegram setup must prohibit caching")
          print("PASS: Telegram setup requires owner authentication")

          # Verify newly deployed v2 routes really exist and are shielded.
          # The old deployed app returns 404; public exposure returns 200.
          for v2_path in (
              "/internal/owner/application-csrf",
              "/applications/new?source=ashby&job_id=smoke",
              "/internal/followups/due",
              "/internal/gmail/review-summary",
          ):
              request = urllib.request.Request(
                  base + v2_path,
                  headers={"User-Agent": "CareerHunter-CI-V2/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=40) as response:
                      code = response.status
              except urllib.error.HTTPError as exc:
                  code = exc.code
              if code != 401:
                  raise SystemExit(
                      f"FAIL: v2 route missing or public: {v2_path} HTTP={code}")
          print("PASS: v2 owner and OIDC routes deployed, anonymous requests denied")
          PY

  report_failed_health:
    needs: health
    if: always() && needs.health.result == 'failure' && github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Notify owner of failed production health check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.site_health_alert
