name: Telegram Connection Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify correct bot access then send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python -m careerhunter.telegram_github --diagnose
          PYTHONPATH=src python -m careerhunter.telegram_github --test
