name: NVIDIA 120B Connection Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerhunter-nvidia-smoke
  cancel-in-progress: false

jobs:
  check_nvidia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one synthetic NVIDIA response directly from GitHub Actions
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: nvidia
          LLM_MODEL: nvidia/nemotron-3.5-super-vl-120b-a12b
          LLM_BASE_URL: https://integrate.api.nvidia.com/v1
        shell: bash
        run: |
          python -m pip install -e .
          python - <<'PY'
          from careerhunter.llm.provider import configured_provider, create_provider
          model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
          provider = create_provider()
          if configured_provider() != "nvidia" or provider is None:
              raise SystemExit("FAIL: NVIDIA GitHub Actions secret is missing")
          if getattr(provider, "model", "") != model:
              raise SystemExit("FAIL: NVIDIA model configuration is invalid")
          try:
              result = provider.analyze_job(
                  {"skills": ["Python", "FastAPI"],
                   "target_roles": ["Junior Python Developer"],
                   "experience": ["student", "junior"]},
                  "title=Junior Python Developer\\nlocation=Remote from Turkey\\n"
                  "description=Python FastAPI internship-friendly role, globally remote.",
              )
          except Exception as exc:
              print("Safe failure category:", type(exc).__name__)
              raise SystemExit("FAIL: NVIDIA synthetic inference was not validated") from None
          if not 0 <= result.total <= 100:
              raise SystemExit("FAIL: NVIDIA response score is invalid")
          print("NVIDIA smoke status: success")
          print("Selected model:", model)
          print("Synthetic JSON validated: true")
          print("PASS: NVIDIA 120B one-call synthetic inference")
          PY
