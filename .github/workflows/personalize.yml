name: Personalized CareerHunter Re-ranking

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rules for all history or NVIDIA AI for top 8"
        required: true
        type: choice
        default: rules
        options: [rules, ai]
  # Only deterministic rules mode for scheduled runs; no NVIDIA/paid calls.
  schedule:
    - cron: '50 15 * * 2,5'

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backfill private personal match scores in Render
        env:
          SCAN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCAN_MODE" = "ai" ]; then
            python src/careerhunter/render_scan_client.py --ai
          else
            python src/careerhunter/render_scan_client.py --rescore
          fi

  alert_personalize_failure:
    needs: backfill
    if: always() && needs.backfill.result == 'failure' && github.event_name == 'schedule' && github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Telegram alert for failed scheduled personal re-ranking
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.automation_alerts personalize
