name: Personalized CareerHunter Re-ranking

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rules for all history or NVIDIA AI for top 8"
        required: true
        type: choice
        default: rules
        options: [rules, ai]
  # Only deterministic rules mode for scheduled runs; no NVIDIA/paid calls.
  schedule:
    - cron: '50 15 * * 2,5'

permissions:
  contents: read

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backfill private personal match scores directly in PostgreSQL
        env:
          SCAN_MODE: ${{ inputs.mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAREERHUNTER_PROFILE_JSON: ${{ secrets.CAREERHUNTER_PROFILE_JSON }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
          LLM_PROVIDER: nvidia
        run: |
          python -m pip install -e .
          if [ "$SCAN_MODE" = "ai" ]; then
            PYTHONPATH=src python -c 'import os; from careerhunter.personal_rescore import enrich_best_existing; print("AI-rescored jobs:", enrich_best_existing(os.environ["DATABASE_URL"]))'
          else
            PYTHONPATH=src python -c 'import os; from careerhunter.personal_rescore import rescore_existing; print("Jobs rescored:", rescore_existing(os.environ["DATABASE_URL"]))'
          fi

  alert_personalize_failure:
    needs: backfill
    if: always() && needs.backfill.result == 'failure' && github.event_name == 'schedule' && github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Telegram alert for failed scheduled personal re-ranking
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.automation_alerts personalize
