name: Personalized CareerHunter Re-ranking

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rules for all history or NVIDIA AI for top 8"
        required: true
        type: choice
        default: rules
        options: [rules, ai]
  push:
    paths:
      - .github/workflows/personalize.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Backfill private personal match scores in Render
        env:
          SCAN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCAN_MODE" = "ai" ]; then
            python src/careerhunter/render_scan_client.py --ai
          else
            python src/careerhunter/render_scan_client.py --rescore
          fi
