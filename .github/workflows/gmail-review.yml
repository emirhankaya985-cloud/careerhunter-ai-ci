name: CareerHunter Gmail Readonly Review

# Owner explicitly enabled this daily, read-only Telegram digest on 2026-11-17.
# Disable the workflow in GitHub Actions if monitoring should stop.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 8 * * *'

permissions:
  contents: read

concurrency:
  group: careerhunter-private-mail-review
  cancel-in-progress: false

jobs:
  read_only_digest:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install mailbox review dependencies
        run: pip install -e .
      - name: Inspect Gmail read-only mailbox in GitHub Actions; notify private owner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAREERHUNTER_GMAIL_READONLY_ENABLED: ${{ secrets.CAREERHUNTER_GMAIL_READONLY_ENABLED }}
          CAREERHUNTER_GMAIL_LEDGER_ENABLED: ${{ secrets.CAREERHUNTER_GMAIL_LEDGER_ENABLED }}
          GMAIL_READONLY_CLIENT_ID: ${{ secrets.GMAIL_READONLY_CLIENT_ID }}
          GMAIL_READONLY_CLIENT_SECRET: ${{ secrets.GMAIL_READONLY_CLIENT_SECRET }}
          GMAIL_READONLY_REFRESH_TOKEN: ${{ secrets.GMAIL_READONLY_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.telegram_mail_review
