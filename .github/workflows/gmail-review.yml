name: CareerHunter Gmail Readonly Review

# Disabled by default. Requires conscious activation after owner OAuth setup.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 8 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-private-mail-review
  cancel-in-progress: false

jobs:
  read_only_digest:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main' && vars.CAREERHUNTER_GMAIL_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Inspect Gmail mailbox via OIDC-protected Render service; notify private owner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.telegram_mail_review
