name: CareerHunter Telegram Report

# Runs after the secretless daily scan. Secrets never enter the scanning job.
on:
  push:
    paths:
      - .github/careerhunter-quality-replay-2026-10-26.txt
  workflow_run:
    workflows: ["Daily Career Intelligence"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-telegram-report
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'push' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New career matches via Telegram
        if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.telegram_only_report
      - name: Scan failure alert
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python -m careerhunter.telegram_github --failure
