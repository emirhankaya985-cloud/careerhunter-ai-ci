name: CareerHunter Gmail Send Capability Preflight

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/gmail-send-preflight.yml
      - src/careerhunter/gmail_send_preflight.py
      - src/careerhunter/scheduled_scan.py
      - src/careerhunter/private_site.py

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[web]'
      - name: Check GitHub send capability without sending mail
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAREERHUNTER_GMAIL_SEND_DATABASE_URL: ${{ secrets.CAREERHUNTER_GMAIL_SEND_DATABASE_URL || secrets.DATABASE_URL }}
          CAREERHUNTER_GMAIL_SEND_ENABLED: ${{ secrets.CAREERHUNTER_GMAIL_SEND_ENABLED }}
          CAREERHUNTER_GMAIL_AUTO_OUTREACH_ENABLED: ${{ secrets.CAREERHUNTER_GMAIL_AUTO_OUTREACH_ENABLED }}
          CAREERHUNTER_GMAIL_AUTO_TEMPLATE_APPROVED: ${{ secrets.CAREERHUNTER_GMAIL_AUTO_TEMPLATE_APPROVED }}
          CAREERHUNTER_GMAIL_READONLY_ENABLED: ${{ secrets.CAREERHUNTER_GMAIL_READONLY_ENABLED }}
          GMAIL_SEND_CLIENT_ID: ${{ secrets.GMAIL_SEND_CLIENT_ID }}
          GMAIL_SEND_CLIENT_SECRET: ${{ secrets.GMAIL_SEND_CLIENT_SECRET }}
          GMAIL_SEND_REFRESH_TOKEN: ${{ secrets.GMAIL_SEND_REFRESH_TOKEN }}
          GMAIL_READONLY_CLIENT_ID: ${{ secrets.GMAIL_READONLY_CLIENT_ID }}
          GMAIL_READONLY_CLIENT_SECRET: ${{ secrets.GMAIL_READONLY_CLIENT_SECRET }}
          GMAIL_READONLY_REFRESH_TOKEN: ${{ secrets.GMAIL_READONLY_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from careerhunter.gmail_send_preflight import build_preflight
          result = build_preflight()
          print(json.dumps(result, sort_keys=True))
          if result.get('messages_sent') != 0:
              raise SystemExit('Unsafe preflight response')
          if result.get('status') != 'ready':
              print('Outbound remains blocked; no email was sent.')
          else:
              print('Send capability and an approved recipient are configured; automatic dispatch remains off.')
          PY
