name: CareerHunter Neon Exact Reconciliation (read-only)

# One-time signed main push probe; manual reruns require a fresh GitHub OIDC token.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/neon-reconcile.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: careerhunter-production-collector
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare every Render and Neon row without writing or leaking data
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import time
          from careerhunter.render_scan_client import call, wait_ready
          wait_ready()
          state = call("/internal/neon-cutover/state")
          print("Live database identity (safe fields):", json.dumps(state, sort_keys=True))
          if state.get("selected_target") not in {"render", "neon"}:
              raise SystemExit("STOP: active database selection invalid")
          if (state.get("selected_target") == "neon"
                  and state.get("effective_backend") != "neon"):
              raise SystemExit("STOP: selected and effective database disagree")
          print("Reconciliation reads the retained original Render URL, not the active selector")
          result = None
          for attempt in range(12):
              try:
                  result = call("/internal/neon-cutover/preflight")
                  break
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc) or attempt == 11:
                      raise
                  time.sleep(15)
          if not isinstance(result, dict):
              raise SystemExit("FAIL: reconciliation route unavailable")
          left = result.get("source_counts")
          right = result.get("target_counts")
          if (not isinstance(left, dict) or not isinstance(right, dict)
                  or len(left) != 10 or len(right) != 10
                  or int(left.get("jobs", 0)) < 1
                  or result.get("source_preservation_verified") is not True):
              print("FAIL: legacy Render data has not been proven preserved in Neon")
              print("Original Render counts:", left)
              print("Live Neon counts:", right)
              raise SystemExit(1)
          status = result.get("status")
          if status == "match":
              if result.get("all_row_hashes_equal") is not True or left != right:
                  raise SystemExit("FAIL: matching status lacks exact row proof")
              print("PASS: all ten tables byte-equivalent")
          elif status == "source_preserved_with_new_neon_rows":
              if (result.get("all_row_hashes_equal") is not False
                      or int(result.get("new_neon_jobs", -1)) != int(right["jobs"]) - int(left["jobs"])
                      or int(result.get("new_neon_runs", -1)) != int(right["runs"]) - int(left["runs"])):
                  raise SystemExit("FAIL: post-cutover preservation metadata invalid")
              print("PASS: every original job ID and first-seen date preserved")
              print("PASS: historical runs and eight other tables remain identical")
              print("Newer Neon jobs:", result.get("new_neon_jobs"))
              print("Newer Neon runs:", result.get("new_neon_runs"))
          else:
              raise SystemExit("FAIL: Render source records missing or changed unexpectedly")
          print("Original Render counts:", json.dumps(left, sort_keys=True))
          print("Live Neon counts:", json.dumps(right, sort_keys=True))
          print("Source was never written by this check")
          PY
