name: CareerHunter CV Vault Target Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cv-vault-preflight.yml
      - src/careerhunter/application_actions.py
      - src/careerhunter/cv_vault.py
      - src/careerhunter/scheduled_scan.py

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'emirhankaya985-cloud/careerhunter-ai-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[web]'
      - name: Verify encrypted CV vault configuration without uploading files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAREERHUNTER_CV_VAULT_KEY: ${{ secrets.CAREERHUNTER_CV_VAULT_KEY }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from sqlalchemy import create_engine, inspect
          from careerhunter.cv_vault import _key, history, vault
          from careerhunter.github_operations import production_database_url
          key_configured = False
          try:
              _key()
              key_configured = True
          except Exception:
              pass
          engine = create_engine(production_database_url(), pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  connection.execute(__import__('sqlalchemy').text('SELECT 1'))
                  inspector = inspect(connection)
                  vault_table_exists = inspector.has_table(vault.name)
                  history_table_exists = inspector.has_table(history.name)
          finally:
              engine.dispose()
          result = {"status": "ready" if (vault_table_exists and history_table_exists
                                             and key_configured) else "blocked",
                    "vault_table_exists": vault_table_exists,
                    "history_table_exists": history_table_exists,
                    "encryption_key_configured": key_configured,
                    "cv_upload_performed": False}
          print(json.dumps(result, sort_keys=True))
          if result["status"] != "ready":
              raise SystemExit(
                  "CV vault tables or GitHub encryption secret are not ready")
          PY

# The signed GitHub workflow sends no CV files or database credentials.
